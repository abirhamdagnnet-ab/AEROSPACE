<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">AeroCampus logo</title>
  <desc id="desc">A stylized jet inside an orbit ring, followed by the AeroCampus wordmark</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="wordAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <circle cx="55" cy="55" r="50" fill="url(#badge)"/>
  <ellipse cx="55" cy="55" rx="40" ry="14" transform="rotate(-28 55 55)"
           fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.9"/>
  <g transform="translate(55 55) rotate(45) scale(0.82)" fill="#FFFFFF">
    <path d="M0 -32 C4 -32 5 -24 5 -10 L26 6 L26 12 L5 4 L5 22 L14 30 L14 34 L0 30 L-14 34 L-14 30 L-5 22 L-5 4 L-26 12 L-26 6 L-5 -10 C-5 -24 -4 -32 0 -32 Z"/>
  </g>
  <circle cx="55" cy="55" r="50" fill="none" stroke="#0891B2" stroke-width="0"/>

  <!-- Wordmark -->
  <text x="124" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#0B1F3A">Aero<tspan fill="#1D4ED8" font-weight="300">Campus</tspan></text>
  <text x="126" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="3.2" fill="#0891B2">AEROSPACE EDUCATION &amp; NEWS</text>
</svg>
